<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>PillPal</title>
  <meta name="description" content="PillPal remembers your pills, scans your bottles, and turns your daily check-ins into a report your doctor can read in a minute.">
  <meta name="theme-color" content="#127479">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:ital,wght@0,400..800;1,400..600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- PillPal design system tokens + components -->
  <link rel="stylesheet" href="/ds/colors.css">
  <link rel="stylesheet" href="/ds/typography.css">
  <link rel="stylesheet" href="/ds/spacing.css">
  <link rel="stylesheet" href="/ds/base.css">
  <link rel="stylesheet" href="/ds/components.css">
  <link rel="stylesheet" href="/styles.css">
  <script>
    // Set the theme before first paint so dark-mode users don't see a white flash.
    if (matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
  </script>
  <script type="module" src="/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="app" aria-busy="true"></div>
  <div id="toasts" aria-live="polite"></div>
  <div id="live" class="sr-only" aria-live="polite"></div>
</body>
</html>
